
name: Build Clash Royale Hub APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' -print -quit)
          unzip "$ZIP" -d source

      - name: Build APK
        run: gradle -p source/ClashRoyaleHub :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Clash-Royale-Hub-APK
          path: source/ClashRoyaleHub/app/build/outputs/apk/debug/app-debug.apk
          
